[project]
name = "enterprise-rag-system"
version = "0.1.0"
description = "Production-ready RAG system with FastAPI backend"
requires-python = ">=3.11"

dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "chromadb>=1.5.9,<1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pymupdf>=1.24",            # PDF parsing
    "streamlit>=1.38",
    "structlog>=24.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.12", # FastAPI file upload
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",   # FastAPI TestClient
]
eval = [
    "ragas>=0.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# E=pycodestyle, F=pyflakes, I=isort, N=naming, UP=pyupgrade, B=bugbear, SIM=simplify

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services (Ollama, DB)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
