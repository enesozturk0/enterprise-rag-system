name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: MyPy type check
        run: python -m mypy src --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            -m "not integration" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Validate production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare non-secret Compose environment
        run: cp .env.production.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: |
          docker build \
            --file docker/api.Dockerfile \
            --tag enterprise-rag-api:ci \
            .

      - name: Build UI image
        run: |
          docker build \
            --file docker/ui.Dockerfile \
            --tag enterprise-rag-ui:ci \
            .

      - name: Verify non-root image users
        run: |
          test "$(docker image inspect \
            --format '{{.Config.User}}' \
            enterprise-rag-api:ci)" = "10001:10001"

          test "$(docker image inspect \
            --format '{{.Config.User}}' \
            enterprise-rag-ui:ci)" = "10001:10001"
